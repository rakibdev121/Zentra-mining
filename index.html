<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentra</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">Z</div>
            <div>
                <h1>ZENTRA</h1>
                <span>Mining Network</span>
            </div>
        </div>

        <button class="profile-btn" id="profile-btn">👤</button>
    </header>

    <main>

        <div class="status">
            <span class="dot"></span>
            <span id="mining-status">LOADING...</span>
        </div>

        <section class="balance-card">
            <p>Your Balance</p>

            <h2>
                <span id="balance">0</span>
                <span>ZNT</span>
            </h2>

            <div class="rate">
                ⚡ 1 ZNT / MINUTE
            </div>
        </section>

        <section class="mining-card">

            <div class="mining-ring">
                <div>
                    <strong id="mining-timer">--:--:--</strong>
                    <small>NEXT CLAIM</small>
                </div>
            </div>

            <button
                class="start-mining-btn"
                id="start-mining-btn">
                START MINING
            </button>

            <button
                class="claim-btn"
                id="claim-btn"
                disabled>
                CLAIM NOT READY
            </button>

        </section>

        <section class="quick-cards">

            <div class="quick-card" id="referral-card">
                <span>🎁</span>
                <p>Referrals</p>
                <strong id="referral-count">0</strong>
                <small id="referral-earned">0 Zentra earned</small>
            </div>

            <div class="quick-card" id="wallet-card">
                <span>👛</span>
                <p>Wallet</p>
                <strong id="wallet-status">Not Connected</strong>
            </div>

        </section>

        <section class="referral-panel" id="referral-panel">

            <h3>🎁 Invite & Earn</h3>

            <p>
                Earn <strong>5,000 Zentra</strong>
                for every successful referral.
            </p>

            <div class="referral-link-box">
                <input
                    id="referral-link"
                    type="text"
                    readonly
                    value="Loading referral link..."
                >

                <button id="copy-referral-btn">
                    COPY
                </button>
            </div>

            <button
                class="share-referral-btn"
                id="share-referral-btn">
                📤 SHARE REFERRAL
            </button>

        </section>

    </main>

    <nav class="bottom-nav">

        <button class="active" id="home-btn">
            <span>⌂</span>
            Home
        </button>

        <button id="mining-btn">
            <span>⛏</span>
            Mining
        </button>

        <button id="referral-btn">
            <span>♧</span>
            Referral
        </button>

        <button id="wallet-btn">
            <span>◈</span>
            Wallet
        </button>

    </nav>

</div>

<script src="app.js"></script>

</body>
</html>
