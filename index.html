<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div class="brand">
                <div class="logo">Z</div>
                <div>
                    <h1>ZENTRA</h1>
                    <span>Mining Network</span>
                </div>
            </div>

            <button class="profile-btn">👤</button>
        </header>


        <main>

            <div class="status">
                <span class="dot"></span>
                MINING ACTIVE
            </div>


            <section class="balance-card">

                <p>Your Balance</p>

                <h2>1,440 <span>ZNT</span></h2>

                <div class="rate">
                    ⚡ 1 ZNT / MINUTE
                </div>

            </section>


            <section class="mining-card">

                <div class="mining-ring">
                    <div>
                        <strong>18:42:16</strong>
                        <small>NEXT CLAIM</small>
                    </div>
                </div>

                <button class="claim-btn">
                    CLAIM 1,440 ZNT
                </button>

            </section>


            <section class="quick-cards">

                <div class="quick-card">
                    <span>🎁</span>
                    <p>Referrals</p>
                    <strong>12</strong>
                </div>

                <div class="quick-card">
                    <span>👛</span>
                    <p>Wallet</p>
                    <strong>Connected</strong>
                </div>

            </section>

        </main>


        <nav class="bottom-nav">

            <button class="active">
                <span>⌂</span>
                Home
            </button>

            <button>
                <span>⛏</span>
                Mining
            </button>

            <button>
                <span>♧</span>
                Referral
            </button>

            <button>
                <span>◈</span>
                Wallet
            </button>

        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
